<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1440px;height:900px;background:#071a33;overflow:hidden}
.sheet{position:absolute;inset:0;background:#0b2545;
 background-image:radial-gradient(circle at 30% 20%,#14355f 0%,#0b2545 55%,#071a33 100%)}
.grain{position:absolute;inset:0;opacity:.28;
 background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
.border{position:absolute;inset:26px;border:1px solid rgba(214,232,255,.45)}
.border::before{content:"";position:absolute;inset:9px;
 border:1px solid rgba(214,232,255,.18)}
.name{position:absolute;top:66px;left:66px;color:#eaf3ff;font-family:Arial,sans-serif;
 font-size:76px;font-weight:700;letter-spacing:.02em;line-height:.95}
.name small{display:block;font-size:13px;letter-spacing:.46em;font-weight:400;
 margin-top:18px;color:#b7d4f2}
.claim{position:absolute;top:250px;left:66px;width:420px;color:#cfe2f7;
 font-family:Arial,sans-serif;font-size:17px;line-height:1.6}
.dwg{position:absolute;top:190px;right:80px}
.title{position:absolute;right:36px;bottom:36px;width:430px;
 border:1px solid rgba(214,232,255,.45);color:#dcebfd;
 font-family:Menlo,monospace;font-size:11px;letter-spacing:.1em}
.title div{display:flex;border-bottom:1px solid rgba(214,232,255,.25)}
.title div:last-child{border-bottom:0}
.title span{padding:9px 12px}
.title span:first-child{width:130px;color:#8fb6dd;
 border-right:1px solid rgba(214,232,255,.25)}
.reg{position:absolute;width:20px;height:20px}
.reg::before,.reg::after{content:"";position:absolute;background:rgba(214,232,255,.6)}
.reg::before{left:0;right:0;top:9px;height:1px}
.reg::after{top:0;bottom:0;left:9px;width:1px}
</style></head><body>
