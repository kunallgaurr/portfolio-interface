<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1440px;height:900px;background:#061018;overflow:hidden;
 font-family:"Helvetica Neue",Arial,sans-serif;color:#eaf4ff}
.glaze{position:absolute;inset:0;background:#07131d;

  linear-gradient(90deg,#0d2740 1px,transparent 1px);
 background-size:60px 60px}
.sheen{position:absolute;inset:0;
 background:radial-gradient(circle at 25% 15%,rgba(60,140,230,.22),transparent 60%)}
.frieze{position:absolute;left:0;right:0;height:60px;
 background-image:repeating-linear-gradient(90deg,#1f6fc4 0 2px,transparent 2px 14px,
  #1f6fc4 14px 16px,transparent 16px 30px);opacity:.5}
.panel{position:absolute;top:150px;left:60px;width:780px;height:540px;
 border:2px solid #2f87d8;background:rgba(10,38,64,.5)}
.panel::before{content:"";position:absolute;inset:10px;border:1px solid #1b5c9b}
.cart{position:absolute;bottom:-1px;left:50%;transform:translateX(-50%) translateY(50%);
 background:#07131d;border:2px solid #2f87d8;padding:10px 34px;
 font-size:13px;letter-spacing:.3em;color:#9ed0ff;white-space:nowrap}
.name{position:absolute;top:168px;right:60px;width:440px;text-align:right}
.name h1{font-size:72px;line-height:.98;font-weight:700;letter-spacing:-.02em;
 color:#f3faff}
.name p{margin-top:22px;font-size:17px;line-height:1.6;color:#a9cdeb}
.name .kick{font-size:12px;letter-spacing:.4em;color:#4aa3ea;margin-bottom:20px}
.blank{position:absolute;top:470px;right:60px;width:200px;height:200px;
 border:1px dashed #28618f;color:#3f7cae;font-size:11px;letter-spacing:.2em;
 display:flex;align-items:center;justify-content:center;text-align:center;padding:14px}
</style></head><body>
